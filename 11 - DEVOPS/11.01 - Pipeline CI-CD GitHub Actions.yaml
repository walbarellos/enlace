# ============================================================================
# PLATAFORMA ENLACE — PIPELINE DE INTEGRAÇÃO CONTÍNUA (CI)
# Arquivo: 11.01 - Pipeline CI-CD GitHub Actions.yaml
# ============================================================================

name: Enlace Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # QUALITY GATE 1: Estilo, Tipagem e Arquitetura
  # --------------------------------------------------------------------------
  quality-gate-1:
    name: "QG1: Lint, Format & Architecture Boundaries"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Validate Architecture Boundaries (ESLint + Boundaries)
        run: npm run lint:boundaries

      - name: Typecheck (Strict TypeScript)
        run: npx tsc --noEmit

  # --------------------------------------------------------------------------
  # QUALITY GATE 2: Pirâmide de Testes Automatizados
  # --------------------------------------------------------------------------
  quality-gate-2:
    name: "QG2: Unit, Integration & Accessibility Tests"
    needs: [quality-gate-1]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: enlace_test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: enlace_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (Coverage >= 85%)
        run: npm run test:unit -- --coverage

      - name: Run Integration Tests (PostgreSQL & Redis)
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://enlace_test_user:test_password@localhost:5432/enlace_test_db"
          REDIS_URL: "redis://localhost:6379"

      - name: Run Accessibility Tests (Playwright + Axe-Core)
        run: npm run test:a11y

  # --------------------------------------------------------------------------
  # QUALITY GATE 3: DevSecOps, Supply Chain e Segurança
  # --------------------------------------------------------------------------
  quality-gate-3:
    name: "QG3: Secret Scan, SAST, SBOM & Dependency Audit"
    needs: [quality-gate-2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SAST (Semgrep OWASP Top 10)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/typescript

      - name: Audit Dependencies (Trivy Lockfile Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file ./sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: ./sbom.json

  # --------------------------------------------------------------------------
  # QUALITY GATE 4: Build e Assinatura Criptográfica da Imagem
  # --------------------------------------------------------------------------
  build-and-sign:
    name: "QG4: Immutable Build & Cosign Signing"
    needs: [quality-gate-3]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/walbarellos/enlace-core:${{ github.sha }}

      - name: Sign Container Image with Cosign
        run: |
          cosign sign --yes ghcr.io/walbarellos/enlace-core:${{ github.sha }}
