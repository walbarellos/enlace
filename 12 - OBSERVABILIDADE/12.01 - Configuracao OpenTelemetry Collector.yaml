# ============================================================================
# PLATAFORMA ENLACE — CONFIGURAÇÃO DO OPENTELEMETRY COLLECTOR
# Arquivo: 12.01 - Configuracao OpenTelemetry Collector.yaml
# ============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Filtro e Higienização de PII em Traces e Logs
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "([0-9]{3})\\.[0-9]{3}\\.[0-9]{3}-([0-9]{2})", "$$1.***.***-$$2")
          - replace_pattern(body, "(?i)password=([^&\\s]+)", "password=[REDACTED]")
          - replace_pattern(body, "(?i)cvv=([^&\\s]+)", "cvv=[REDACTED]")

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: enlace
    send_timestamps: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      resource:
        service.name: "service_name"
        deployment.environment: "environment"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [loki]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
